<script>
// ---------- caching & API ----------
const nativeFetch=window.fetch.bind(window); 
async function apiFetch(url,options={}){ 
  const cacheKey=url+JSON.stringify(options); 
  const cached=cache.get(cacheKey); 
  const cacheAge=Date.now()-(cacheTime.get(cacheKey)||0); 
  if(cached&&cacheAge<300000){/* 5 minutes cache */ return cached} 
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),18000); 
  try{ 
    const res=await nativeFetch(url,{...options,signal:options.signal||ctl.signal,mode:'cors',credentials:'omit'}); 
    if(!res.ok)throw new Error('API error: '+res.status); 
    const data=await res.json(); 
    cache.set(cacheKey,data); 
    cacheTime.set(cacheKey,Date.now()); 
    return data; 
  }catch(e){ 
    cache.delete(cacheKey); 
    cacheTime.delete(cacheKey); 
    throw e; 
  }finally{clearTimeout(timer)} 
}
// -------------------------------------

// ---------- debounce utility ----------
const debounce=(fn,delay)=>{let timeout;return function(...args){clearTimeout(timeout);timeout=setTimeout(()=>fn.apply(this,args),delay)}};
// -------------------------------------

const $=s=>document.querySelector(s),esc=s=>nd(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='madarik_v2',METHODS=['كمي','نوعي','مختلط','مراجعة منهجية','نظري/مفاهيمي','غير محدد'];

// ---------- tab navigation ----------
/**
 * Function: tab(t)
 * Purpose: Switch between different study sections
 * Parameters: t - section identifier (explore, screen, matrix, citations, reader, synth, refs)
 * Behavior: Hides all sections, shows target section, updates nav button active states
 * Dependencies: renderScreen, renderMatrix, renderCitationMap, renderReader, renderSynth, renderRefs
 */
function tab(t){const nb=document.querySelector('#pageTools button:last-child');if(nb)nb.style.display=t==='explore'?'':'none';document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==t);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));var renderers={screen:renderScreen,matrix:renderMatrix,citations:renderCitationMap,reader:renderReader,synth:renderSynth,refs:renderRefs};if(t in renderers){renderers[t]()}
}
// -------------------------------------

// ---------- initialization ----------
/**
 * Function: init()
 * Purpose: Initialize application state on page load
 */
function init(){ensureProjects();renderProjSel();applyProjUI();applyZoom();applyOv();normalizeLibrary(true);renderStats();renderCounts();renderHist();$('#styleSelect').value=S.style||'apa';$('#mail').value=S.mail||'';upd();toggleCoreKey();tab('explore');try{$('#q').focus({preventScroll:true})}catch(e){}
// -------------------------------------

function pn(n){n=n.trim();const og=n.match(/^\{(.*)\}$/);if(og)return{f:og[1].trim(),g:''};if(/[,،]/.test(n)){const[f,g]=n.split(/[,،]/);return{f:f.trim(),g:(g||'').trim()}}const w=n.split(/\s+/);return{f:w.pop(),g:w.join(' ')}}
// -------------------------------------

const ini=g=>g.split(/[\s\-]+/).filter(Boolean).map(x=>x[0]+'.').join(' ');
// -------------------------------------

function apaAuth(p){const ar=arAuth(p),L=authList(p).map(pn).map(a=>a.f+(a.g?(ar?'، ':'')+'&'+ini(a.g):'')),n=L.length;if(!n)return esc(p.title);if(n===1)return esc(L[0]);const amp=ar?' و':', &';return esc(n===2?L[0]+amp+' '+L[1]:L.slice(0,-1).join(ar?'، ':', ')+amp+' '+L[n-1])}
// -------------------------------------

function apa(p){if(ptype(p)!=='article')return fmtOther(p,'apa',0);const ar=isAr(p.title),sp=p.pages?p.pages.replace(/-/g,'–'):'';lets=dotted(apaAuth(p))+' ('+(p.year||'د.ت.')+'). '+ttl(p)+'.';if(p.venue){s+=' <i>'+esc(p.venue)+'</i>';if(p.vol)s+=ar?'، <i>'+esc(p.vol)+'</i>':', <i>'+esc(p.vol)+'</i>';if(p.issue)s+='('+esc(p.issue)+')';if(sp)s+=(ar?'، ':', ')+esc(sp);s+='.'}if(p.doi)s+=' https://doi.org/'+esc(p.doi);else if(p.url)s+=' '+esc(p.url);returns}
// -------------------------------------

const plain=h=>h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
// -------------------------------------

const NUMERIC=['ieee','vancouver','ama'];
const MT=()=>S.mail?'&mailto='+encodeURIComponent(S.mail):'';
const nm=p=>authList(p).map(pn);
// -------------------------------------

const inits=(g,dot,sp)=>g.split(/[\s\-]+/).filter(Boolean).map(x=>x[0]+(dot?'.':'')).join(sp);
const dotted=s=>!s?'':/[.?!]$/.test(s)?s:s+'.';
// -------------------------------------

function authStr(p,st){const L=nm(p),n=L.length,ar=arAuth(p),AND=ar?'و':'and',ET=ar?' وآخرون':' et al.';if(!n)return'';const fl=a=>(a.g?a.g+' ':'')+a.f,lf=a=>a.f+(a.g?', '+a.g:'');if(st==='ieee'){const f=a=>(a.g?inits(a.g,1,' ')+' ':'')+a.f;return n>6?f(L[0])+ET:n===1?f(L[0]):n===2?f(L[0]):f(L[0])+' '+AND+' '+f(L[1]):L.slice(0,-1).map(f).join(', ')+', '+AND+' '+f(L[n-1])}if(st==='mla')return n===1?lf(L[0]):n===2?lf(L[0])+', '+AND+' '+fl(L[1]):lf(L[0])+','+ET;if(st==='chicago'){if(n>10)return[lf(L[0]),...L.slice(1,7).map(fl)].join(', ')+','+ET;return n===1?lf(L[0]):n===2?lf(L[0])+', '+AND+' '+fl(L[1]):[lf(L[0]),...L.slice(1,-1).map(fl)].join(', ')+', '+AND+' '+fl(L[n-1])}if(st==='harvard'){const f=a=>a.f+(a.g?', '+inits(a.g,1,''):'');return n>3?f(L[0])+ET:n===1?f(L[0]):L.slice(0,-1).map(f).join(', ')+' '+AND+' +f(L[n-1])}const f=a=>a.f+(a.g?' '+inits(a.g,0,''):'');return n>6?L.slice(0,st==='ama'?3:6).map(f).join(', ')+', et al':L.map(f).join(', ')}
// -------------------------------------

function formatRef(p,st='apa',idx=0){if(st==='apa')return apa(p);if(ptype(p)!=='article')return fmtOther(p,st,idx);const A=esc(authStr(p,st)),ti=ttl(p),v=esc(p.venue||''),vol=esc(p.vol||''),is=esc(p.issue||''),pg=esc((p.pages||'').replace(/-/g,'–')),y=esc(p.year||'n.d.'),doi=p.doi?'https://doi.org/'+esc(p.doi):esc(safeUrl(p.url)),n=idx+1,LB=isAr(p.title)?{vol:'مج. ',no:'ع. ',pp:'ص. '}:{vol:'vol. ',no:'no. ',pp:'pp. '},it=v?'<i>'+v+'</i>:'';if(st==='ieee')return`[${n}] ${A?A+', ':''}“${ti},” ${[it,vol&&LB.vol+vol,is&&LB.no+is,pg&&LB.pp+pg,y].filter(Boolean).join(', ')}.${doi?' '+doi:''}`;if(st==='mla')return`${A?dotted(A)+' ':''}“${ti}.” ${[it,vol&&LB.vol+vol,is&&LB.no+is,y,pg&&LB.pp+pg].filter(Boolean).join(', ')}.${doi?' '+doi:''}`;if(st==='chicago')return`${A?dotted(A)+' ':''}${y}. “${ti}.” ${it}${vol?' '+vol:''}${is?' ('+is+')':''}${pg?': '+pg:''}.${doi?' '+doi:''}`;if(st==='harvard')return`${A?A+' ':''}(${y}) ‘${ti}’${it?', '+it:''}${vol?', '+vol:''}${is?'('+is+')':''}${pg?', '+LB.pp+pg:''}.${doi?' Available at: '+doi+'.':''}`;return`${n}. ${A?dotted(A)+' ':''}${ti}. ${v?(st==='ama'?it:v)+'. ':''}${y}${vol?(st==='ama'?';':';')+vol:''}${is?'('+is+')':''}${pg?':'+pg:''}.${p.doi?' doi:'+esc(p.doi):''}`}
// -------------------------------------

function inText(p,st='apa',idx=0,page){if(NUMERIC.includes(st))return`[${idx+1}]`;if(st==='apa')return cite(p,page);const L=nm(p),n=L.length,ar=isAr(p.title),f=L.map(a=>a.f),a=!n?'«'+(p.title||'').slice(0,30)+'»':n===1?f[0]:n===2?f[0]+(ar?' و ':'and ')+f[1]:f[0]+(ar?' آخرون':' et al.'),y=p.year||'n.d.';if(st==='mla')return`${a}${page?' '+page:''}`;if(st==='chicago')return`${a} ${y}${page?', '+page:''}`;return`${a} ${y}${page?', p. '+page:''}`}
// -------------------------------------

function cite(p,page){const ar=arAuth(p),L=authList(p).map(pn).map(a=>a.f),n=L.length;const a=!n?'«'+(p.title||'').slice(0,30)+'»':n===1?L[0]:n===2?L[0]+(ar?' و':' &')+' '+L[1]:L[0]+(ar?' والآخرون':' et al.');return`${a}${ar?'، ':' '}${p.year||'د.ت.'}${page?(ar?'، ص. ':'ص. ')+page}`}
// -------------------------------------

/* ---------- retrieval ---------- */
const newId=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const inv=o=>{if(!o)return'';const a=[];for(const[w,ps]of Object.entries(o))ps.forEach(i=>a[i]=w);return a.join(' ')};
const fromOA=w=>{const l=w.primary_location||{},b=w.biblio||{};return{id:newId(),openalexId:w.id||'',referencedWorks:w.referenced_works||[],citedByCount:w.cited_by_count||0,doi:(w.doi||'').replace('https://doi.org/',''),title:w.display_name||'',authors:(w.authorships||[]).map(a=>a.author.display_name),year:w.publication_year||'',venue:(l.source||{}).display_name||'',vol:b.volume||'',issue:b.issue||'',pages:[b.first_page,b.last_page].filter(Boolean).join('–'),abstract:inv(w.abstract_inverted_index),url:w.doi||l.landing_page_url||'',pdf:(w.open_access||{}).oa_url||}};
const fromCR=m=>({id:newId(),doi:m.DOI||'',title:(m.title||[''])[0],authors:(m.author||[]).map(a=>(a.family?a.family+', '+(a.given||''):a.name||'')),year:((m.issued||{})['date-parts']||[[]])[0][0]||'',venue:(m['container-title']||[''])[0],vol:m.volume||'',issue:m.issue||'',pages:m.page||'',abstract:(m.abstract||'').replace(/<[^>]+>/g,' ').trim(),url:m.URL||''});
const clean=h=>(h||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';const lnk=p=>p.doi?'https://doi.org/'+p.doi:safeUrl(p.url);

/* ---------- adaptive query planning ---------- */
const STOP_AR=new Set(['في','من','على','إلى','عن','ما','هو','هي','هذا','هذه','تلك','مع','ب','بعد','قبل','دور','أثر','مدى','واقع','نحو','حول','دراسة','بحث','تحليل','استخدام','توظيف','لدى','ضمن','عبر','كل','بعض','أو','و','التي','الذي','كما','أن','إن','كان','كانت']);
const STOP_EN=new Set(['the','a','an','of','in','on','for','to','and','or','with','by','from','at','is','are','was','were','impact','effect','role','study','research','analysis','use','using','toward','among']);
function makeQueryPlan(title){const cleanTitle=title.trim().replace(/\s+/g,' ');const words=cleanTitle.replace(/[\u064B-\u065F\u0670\u0640]/g,'').match(/[\p{L}\p{N}][\p{L}\p{N}\-]{1,}/gu)||[];const stop=isAr(cleanTitle)?STOP_AR:STOP_EN;const useful=[...new Set(words.filter(w=>!stop.has(w.toLowerCase()) && w.length>2))];const keywordQuery=useful.slice(0,8).join(' ');const variants=[{kind:'العنوان الأصلي',query:cleanTitle}];if(keywordQuery && keywordQuery.toLowerCase()!==cleanTitle.toLowerCase())variants.push({kind:'الكلمات المفتاحية المستخلصة',query:keywordQuery});return {title:cleanTitle,keywords:useful,variants};}
function engineQueries(key,plan){if(key==='s2') return [plan.variants[0]];if(key==='cr') return plan.variants[1]?[{kind:'عنوان البحث',query:plan.title},{kind:'كلمات مفتاحية',query:plan.variants[1].query}]:[{kind:'عنوان البحث',query:plan.title}];if(key==='zn') return plan.variants[1]?[{kind:'عنوان وملخص',query:plan.title},{kind:'كلمات مفتاحية',query:plan.variants[1].query}]:[{kind:'عنوان وملخص',query:plan.title}];return plan.variants;}
}
const ENG={oa:{n:'OpenAlex',f:async q=>{const f=$('#arOnly').checked?'&filter=language:ar';const r=await apiFetch('https://api.openalex.org/works?per-page=15&search='+encodeURIComponent(q)+f+MT());if(!r.ok)throw 0;return(await r.json()).results.map(fromOA)},cr:{n:'Crossref',f:async q=>{const r=await apiFetch('https://api.crossref.org/works?rows=15&query.title='+encodeURIComponent(q)+MT());if(!r.ok)throw 0;return(await r.json()).message.items.map(fromCR)},s2:{n:'Semantic Scholar',f:async q=>{const r=await apiFetch('https://api.semanticscholar.org/graph/v1/paper/search?limit=15&fields=title,authors,year,venue,abstract,externalIds,url,tldr,openAccessPdf,journal&query='+encodeURIComponent(q));if(!r.ok)throw 0;return((await r.json()).data||[]).map(w=>({id:newId(),doi:(w.externalIds||{}).DOI||'',title:w.title||'',authors:(w.authors||[]).map(a=>a.name),year:w.year||'',venue:(w.journal||{}).name||w.venue||'',vol:(w.journal||{}).volume||'',issue:'',pages:(w.journal||{}).pages||'',abstract:w.abstract||'',tldr:(w.tldr||{}).text||'',pdf:(w.openAccessPdf||{}).url||'',url:w.url||''))},pm:{n:'Europe PMC / PubMed',f:async q=>{const r=await apiFetch('https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&resultType=core&pageSize=15&query='+encodeURIComponent(q));if(!r.ok)throw 0;return((await r.json()).resultList.result||[]).map(w=>{const j=w.journalInfo||{};return{id:newId(),doi:w.doi||'',title:clean(w.title),authors:((w.authorList||{}).author||[]).map(a=>a.lastName?a.lastName+', '+(a.firstName||a.initials||''):a.fullName||''),year:w.pubYear||'',venue:(j.journal||{}).title||w.journalTitle||'',vol:j.volume||'',issue:j.issue||'',pages:w.pageInfo||'',abstract:clean(w.abstractText),url:w.doi?'https://doi.org/'+w.doi:'https://europepmc.org/article/'+w.source+'/'+w.id)}}},dj:{n:'DOAJ',f:async q=>{const r=await apiFetch('https://doaj.org/api/search/articles/'+encodeURIComponent(q)+'?pageSize=15');if(!r.ok)throw new Error('DOAJ HTTP '+r.status);return((await r.json()).results||[]).map(x=>{const b=x.bibjson||{},d=(b.identifier||[]).find(i=>i.type==='doi'),j=b.journal||{};return{id:newId(),doi:d?d.id:'',title:b.title||'',authors:(b.author||[]).map(a=>a.name),year:b.year||'',venue:j.title||'',vol:j.volume||'',issue:j.number||'',pages:[b.start_page,b.end_page].filter(Boolean).join('–'),abstract:b.abstract||'',url:((b.link||[])[0]||{}).url||(d?'https://doi.org/'+d.id:'')))}},ax:{n:'arXiv',f:async q=>{const u='https://export.arxiv.org/api/query?max_results=15&sortBy=relevance&search_query=all:'+encodeURIComponent(q);const r=await apiFetch(u);if(!r.ok)throw new Error('arXiv HTTP '+r.status);const xml=new DOMParser().parseFromString(await r.text(),'text/xml');if(xml.querySelector('parsererror'))throw new Error('تعذر قراءة استجابة arXiv');return [...xml.getElementsByTagName('entry')].map(w=>{const get=t=>w.getElementsByTagName(t)[0]?.textContent?.trim()||'';const link=[...w.getElementsByTagName('link')].find(x=>x.getAttribute('title')==='pdf')?.getAttribute('href')||'';const id=get('id');return{id:newId(),doi:'',title:get('title').replace(/\s+/g,' '),authors:[...w.getElementsByTagName('author')].map(a=>a.getElementsByTagName('name')[0]?.textContent||''),year:get('published').slice(0,4),venue:'arXiv preprint',vol:'',issue:'',pages:'',abstract:get('summary').replace(/\s+/g,' '),url:id,pdf:link}})}}, zn:{n:'Zenodo',f:async q=>{const r=await apiFetch('https://zenodo.org/api/records/?size=15&sort=bestmatch&q='+encodeURIComponent(q));if(!r.ok)throw new Error('Zenodo HTTP '+r.status);return((await r.json()).hits?.hits||[]).map(w=>{const m=w.metadata||{},creators=m.creators||[],doi=w.doi||m.doi||'';const files=w.files||[];const pdf=files.find(f=>(f.key||'').toLowerCase().endsWith('.pdf'));return{id:newId(),doi,title:m.title||'',authors:creators.map(a=>a.name||''),year:(m.publication_date||w.created||'').slice(0,4),venue:m.publisher||m.imprint?.publisher||'Zenodo repository',vol:'',issue:'',pages:'',abstract:m.description?.replace(/<[^>]+>/g,' ')||'',url: const normTitle=p=>(p.title||'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670~]/g,'').replace(/[’‘`´]/g,"'").replace(/[^\p{L}\p{N}]/gu,'').trim();

const nk=p=>normDoi(p)||normTitle(p);

function merge(lists){const records=[],byDoi=new Map(),byTitle=new Map();for(const list of lists){for(const raw of list){const p={...raw,doi:normDoi(raw),src:[...new Set(raw.src||[])]};const doi=normDoi(p),title=normTitle(p);if(!doi&&!title)continue;let existing=(doi&&byDoi.get(doi))||(title&&byTitle.get(title));if(!existing){existing={...p,src:[...p.src],qs:[...(p.qs||[])]};records.push(existing)}else{existing.src=[...new Set([...(existing.src||[]),...(p.src||[])])];existing.qs=[...new Set([...(existing.qs||[]),...(p.qs||[])])];for(const field of ['abstract','tldr','pdf','url','venue','vol','issue','pages','doi','year','openalexId','referencedWorks','citedByCount'])if((!existing[field]||existing[field]==='')&&p[field])existing[field]=p[field];if((p.authors||[]).length>(existing.authors||[]).length)existing.authors=p.authors;if((p.title||'').length>(existing.title||'').length)existing.title=p.title;}if(doi)byDoi.set(doi,existing);if(title)byTitle.set(title,existing);}return records.sort((a,b)=>((b.src?.length||0)+(b.qs?.length||0))-((a.src?.length||0)+(a.qs?.length||0)));}
